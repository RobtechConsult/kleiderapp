# Builds the web version of the app and publishes it to GitHub Pages:
# https://robtechconsult.github.io/kleiderapp/
name: Deploy web preview to GitHub Pages

on:
  push:
    branches: [main, claude/app-projekt-setup-020ppz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx expo export --platform web --output-dir dist
      # GitHub Pages shows 404.html for unknown paths.
      - run: cp "dist/+not-found.html" dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
